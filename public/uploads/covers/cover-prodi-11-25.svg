<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="600" fill="url(#bg)" />
  <rect width="400" height="600" fill="url(#grid)" />
  <rect width="400" height="600" fill="url(#overlay)" />

  <!-- Decorative Shapes -->
  <circle cx="360" cy="80" r="140" fill="rgba(255,255,255,0.06)" />
  <circle cx="40" cy="520" r="160" fill="rgba(0,0,0,0.15)" />
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" rx="8" />

  <!-- Top Badge -->
  <rect x="45" y="55" width="160" height="28" fill="rgba(255,255,255,0.18)" rx="14" />
  <text x="55" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">💻 Teknologi Informasi</text>
  
  <text x="355" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="rgba(255,255,255,0.7)" text-anchor="end">IT-25</text>

  <!-- Publisher Header Line -->
  <line x1="45" y1="100" x2="355" y2="100" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Book Title -->
  <g transform="translate(45, 210)">
    <text x="0" y="0" font-family="'Georgia', 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#ffffff">Kecerdasan Buatan dan</text>
    <text x="0" y="34" font-family="'Georgia', 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#ffffff">(Artificial Intelligence)</text>
    <text x="0" y="68" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#f8fafc">Deep Learning (Konsep Dasar dan Praktikum Hands-on)</text>
  </g>

  <!-- Accent Line -->
  <rect x="45" y="340" width="60" height="4" fill="#f59e0b" rx="2" />

  <!-- Author Section -->
  <g transform="translate(45, 420)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1">PENULIS / TIM PENYUSUN</text>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Dr. Didik Dwi Prasetyo, M.T</text>
  </g>

  <!-- Footer Branding -->
  <rect x="45" y="490" width="310" height="1" fill="rgba(255,255,255,0.2)" />
  <text x="45" y="525" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="0.5">SARI DIGITAL LIBRARY</text>
  <text x="45" y="542" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.6)">Universitas Sari Mulia</text>

  <!-- Book Spine Detail -->
  <rect x="0" y="0" width="10" height="600" fill="rgba(0,0,0,0.25)" />
</svg>