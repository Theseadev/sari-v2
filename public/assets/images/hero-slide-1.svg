<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#g1)"/>

  <!-- Decorative circles -->
  <circle cx="500" cy="80" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="80" cy="320" r="140" fill="rgba(0,0,0,0.12)"/>

  <!-- Illustration Graphic Elements -->
  <g transform="translate(350, 100)">
    <!-- Big Book Graphic -->
    <rect x="0" y="20" width="180" height="140" rx="12" fill="#ffffff" opacity="0.95" />
    <path d="M 0 20 Q 90 35 180 20 L 180 160 Q 90 175 0 160 Z" fill="#eff6ff" />
    <line x1="90" y1="25" x2="90" y2="168" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4,4" />
    <rect x="20" y="45" width="55" height="8" rx="4" fill="#93c5fd" />
    <rect x="20" y="65" width="50" height="6" rx="3" fill="#cbd5e1" />
    <rect x="20" y="80" width="45" height="6" rx="3" fill="#cbd5e1" />
    <rect x="105" y="45" width="55" height="8" rx="4" fill="#3b82f6" />
    <rect x="105" y="65" width="50" height="6" rx="3" fill="#cbd5e1" />
    <rect x="105" y="80" width="45" height="6" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Mascot / Badge Header -->
  <rect x="30" y="30" width="320" height="65" rx="32" fill="#16a34a" />
  <text x="50" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Literasi Digital Kampus 📚</text>

  <!-- Title Text inside banner -->
  <text x="35" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Akses Tanpa Batas</text>
  <text x="35" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#93c5fd">Kapan Saja &amp; Di Mana Saja.</text>

  <!-- Bottom Dark Gradient Overlay for Caption -->
  <rect y="280" width="600" height="120" rx="0" fill="url(#overlay)"/>
  <text x="35" y="350" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Literasi untuk Civitas Akademika.</text>
  <text x="35" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Universitas Sari Mulia Banjarmasin</text>
</svg>